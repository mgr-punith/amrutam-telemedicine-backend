name: amrutam-telemedicine

services:
  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: development
      PORT: 3000
      METRICS_PORT: 9100
      LOG_LEVEL: info
      CORS_ALLOWED_ORIGINS: http://localhost:3001
      DATABASE_URL: postgresql://amrutam:amrutam@postgres:5432/amrutam
      REDIS_URL: redis://redis:6379
      AMRUTAM_ENCRYPTION_KEYS: ${AMRUTAM_ENCRYPTION_KEYS:?Set AMRUTAM_ENCRYPTION_KEYS in .env}
      AMRUTAM_ACTIVE_ENCRYPTION_KEY_VERSION: ${AMRUTAM_ACTIVE_ENCRYPTION_KEY_VERSION:-v1}
      AMRUTAM_JWT_PRIVATE_KEY_BASE64: ${AMRUTAM_JWT_PRIVATE_KEY_BASE64:?Set AMRUTAM_JWT_PRIVATE_KEY_BASE64 in .env}
      AMRUTAM_JWT_PUBLIC_KEY_BASE64: ${AMRUTAM_JWT_PUBLIC_KEY_BASE64:?Set AMRUTAM_JWT_PUBLIC_KEY_BASE64 in .env}
      AMRUTAM_JWT_KEY_ID: ${AMRUTAM_JWT_KEY_ID:-local-v1}
      AMRUTAM_JWT_ISSUER: ${AMRUTAM_JWT_ISSUER:-amrutam-api}
      AMRUTAM_JWT_AUDIENCE: ${AMRUTAM_JWT_AUDIENCE:-amrutam-clients}
      AMRUTAM_ACCESS_TOKEN_TTL_SECONDS: ${AMRUTAM_ACCESS_TOKEN_TTL_SECONDS:-900}
      AMRUTAM_REFRESH_TOKEN_TTL_SECONDS: ${AMRUTAM_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      AMRUTAM_TOTP_ISSUER: ${AMRUTAM_TOTP_ISSUER:-Amrutam}
      AMRUTAM_PAYMENT_WEBHOOK_SECRET: ${AMRUTAM_PAYMENT_WEBHOOK_SECRET:?Set AMRUTAM_PAYMENT_WEBHOOK_SECRET in .env}
      AMRUTAM_SERVICE_NAME: amrutam-api
      AMRUTAM_OTEL_EXPORTER_ENDPOINT: ${AMRUTAM_OTEL_EXPORTER_ENDPOINT:-}
    ports:
      - '3000:3000'
      - '9100:9100'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runtime
    command: ['node', '--import', './dist/instrumentation.js', 'dist/worker.js']
    environment:
      NODE_ENV: development
      PORT: 3000
      METRICS_PORT: 9101
      LOG_LEVEL: info
      CORS_ALLOWED_ORIGINS: http://localhost:3001
      DATABASE_URL: postgresql://amrutam:amrutam@postgres:5432/amrutam
      REDIS_URL: redis://redis:6379
      AMRUTAM_SERVICE_NAME: amrutam-worker
      AMRUTAM_OTEL_EXPORTER_ENDPOINT: ${AMRUTAM_OTEL_EXPORTER_ENDPOINT:-}
      AMRUTAM_WORKER_SCAN_INTERVAL_MS: 60000
    ports:
      - '9101:9101'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9101/metrics']
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: build
    command: ['npm', 'run', 'db:migrate']
    environment:
      DATABASE_URL: postgresql://amrutam:amrutam@postgres:5432/amrutam
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  seed:
    build:
      context: .
      target: build
    command: ['npm', 'run', 'db:seed']
    profiles: ['seed']
    environment:
      DATABASE_URL: postgresql://amrutam:amrutam@postgres:5432/amrutam
      AMRUTAM_ENCRYPTION_KEYS: ${AMRUTAM_ENCRYPTION_KEYS:?Set AMRUTAM_ENCRYPTION_KEYS in .env}
      AMRUTAM_ACTIVE_ENCRYPTION_KEY_VERSION: ${AMRUTAM_ACTIVE_ENCRYPTION_KEY_VERSION:-v1}
      AMRUTAM_JWT_PRIVATE_KEY_BASE64: ${AMRUTAM_JWT_PRIVATE_KEY_BASE64:?Set AMRUTAM_JWT_PRIVATE_KEY_BASE64 in .env}
      AMRUTAM_JWT_PUBLIC_KEY_BASE64: ${AMRUTAM_JWT_PUBLIC_KEY_BASE64:?Set AMRUTAM_JWT_PUBLIC_KEY_BASE64 in .env}
      AMRUTAM_JWT_KEY_ID: ${AMRUTAM_JWT_KEY_ID:-local-v1}
      AMRUTAM_JWT_ISSUER: ${AMRUTAM_JWT_ISSUER:-amrutam-api}
      AMRUTAM_JWT_AUDIENCE: ${AMRUTAM_JWT_AUDIENCE:-amrutam-clients}
      AMRUTAM_ACCESS_TOKEN_TTL_SECONDS: ${AMRUTAM_ACCESS_TOKEN_TTL_SECONDS:-900}
      AMRUTAM_REFRESH_TOKEN_TTL_SECONDS: ${AMRUTAM_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      AMRUTAM_TOTP_ISSUER: ${AMRUTAM_TOTP_ISSUER:-Amrutam}
      AMRUTAM_PAYMENT_WEBHOOK_SECRET: ${AMRUTAM_PAYMENT_WEBHOOK_SECRET:?Set AMRUTAM_PAYMENT_WEBHOOK_SECRET in .env}
      AMRUTAM_DEMO_PASSWORD: ${AMRUTAM_DEMO_PASSWORD:?Set AMRUTAM_DEMO_PASSWORD in .env}
      AMRUTAM_DEMO_MFA_SECRET: ${AMRUTAM_DEMO_MFA_SECRET:?Set AMRUTAM_DEMO_MFA_SECRET in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amrutam
      POSTGRES_USER: amrutam
      POSTGRES_PASSWORD: amrutam
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amrutam -d amrutam']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: ['observability']
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.60
    profiles: ['observability']
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ['observability']
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
