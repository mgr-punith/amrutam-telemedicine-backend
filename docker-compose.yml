name: amrutam-telemedicine

services:
  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: development
      PORT: 3000
      METRICS_PORT: 9100
      LOG_LEVEL: info
      CORS_ALLOWED_ORIGINS: http://localhost:3001
      DATABASE_URL: postgresql://amrutam:amrutam@postgres:5432/amrutam
      REDIS_URL: redis://redis:6379
      AMRUTAM_ENCRYPTION_KEYS: ${AMRUTAM_ENCRYPTION_KEYS:?Set AMRUTAM_ENCRYPTION_KEYS in .env}
      AMRUTAM_ACTIVE_ENCRYPTION_KEY_VERSION: ${AMRUTAM_ACTIVE_ENCRYPTION_KEY_VERSION:-v1}
      AMRUTAM_JWT_PRIVATE_KEY_BASE64: ${AMRUTAM_JWT_PRIVATE_KEY_BASE64:?Set AMRUTAM_JWT_PRIVATE_KEY_BASE64 in .env}
      AMRUTAM_JWT_PUBLIC_KEY_BASE64: ${AMRUTAM_JWT_PUBLIC_KEY_BASE64:?Set AMRUTAM_JWT_PUBLIC_KEY_BASE64 in .env}
      AMRUTAM_JWT_KEY_ID: ${AMRUTAM_JWT_KEY_ID:-local-v1}
      AMRUTAM_JWT_ISSUER: ${AMRUTAM_JWT_ISSUER:-amrutam-api}
      AMRUTAM_JWT_AUDIENCE: ${AMRUTAM_JWT_AUDIENCE:-amrutam-clients}
      AMRUTAM_ACCESS_TOKEN_TTL_SECONDS: ${AMRUTAM_ACCESS_TOKEN_TTL_SECONDS:-900}
      AMRUTAM_REFRESH_TOKEN_TTL_SECONDS: ${AMRUTAM_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      AMRUTAM_TOTP_ISSUER: ${AMRUTAM_TOTP_ISSUER:-Amrutam}
      AMRUTAM_PAYMENT_WEBHOOK_SECRET: ${AMRUTAM_PAYMENT_WEBHOOK_SECRET:?Set AMRUTAM_PAYMENT_WEBHOOK_SECRET in .env}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amrutam
      POSTGRES_USER: amrutam
      POSTGRES_PASSWORD: amrutam
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amrutam -d amrutam']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
